        ]
      }
    </script>
    <script>
      // Runs before first paint. `motion` enables reveal transitions; without JS (or with
      // reduced motion) content is visible immediately. If the app bundle never boots, drop
      // `motion` so nothing stays hidden.
      (function () {
        var d = document.documentElement;
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        d.classList.add('js', reduce ? 'reduce' : 'motion');
        if (/[?&]og=1/.test(location.search)) d.classList.add('og');
        setTimeout(function () {
          if (!window.__app) d.classList.remove('motion');
        }, 4000);
      })();
    </script>

  <body>
    <div id="root"><!--app--></div>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
